<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journey to Campus — Research Adventure</title><style>
*{box-sizing:border-box}body{margin:0;background:#172332;color:#fff;font-family:system-ui,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}h1{font-size:23px;margin:6px}p{margin:5px 0 12px;color:#cbd5e1}#wrap{position:relative;width:min(960px,100%)}canvas{display:block;width:100%;image-rendering:pixelated;background:#7dbd70;border:5px solid #f2e7b9;border-radius:8px}#hud{display:flex;justify-content:space-between;gap:10px;background:#27384a;padding:10px;border-radius:7px 7px 0 0;flex-wrap:wrap}#overlay{position:absolute;inset:0;background:#0b1420c9;display:none;align-items:center;justify-content:center;padding:20px}#panel{background:#fff5dc;color:#202b35;border:4px solid #35485a;border-radius:10px;padding:18px;width:min(650px,100%);max-height:90%;overflow:auto}#panel h2{margin:0 0 10px}button{border:0;background:#315b90;color:white;border-radius:5px;padding:10px 14px;cursor:pointer;margin:5px 5px 0 0;font-size:15px}button:hover{background:#23446c}#controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px;background:#27384a;border-radius:0 0 7px 7px}#dpad{display:grid;grid-template-columns:repeat(3,42px);gap:3px}#dpad button{margin:0;padding:9px}#dpad button:nth-child(1){grid-column:2}#dpad button:nth-child(2){grid-column:1;grid-row:2}#dpad button:nth-child(3){grid-column:2;grid-row:2}#dpad button:nth-child(4){grid-column:3;grid-row:2}video{width:100%;max-height:330px;background:black}small{color:#cbd5e1}
</style></head><body><h1>Journey to Campus</h1><p>An interactive exploration of student transportation and accessibility</p><div id="wrap"><div id="hud"><strong id="sceneLabel">Bus Stop</strong><span id="mission">Mission: Interview 2 students (0/2)</span></div><canvas id="game" width="960" height="520"></canvas><div id="controls"><span>Move: WASD / arrows · Interact: E · Click people or bus</span><div id="dpad"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div><button id="interact">Interact (E)</button></div><div id="overlay"><div id="panel"><h2 id="panelTitle"></h2><div id="panelBody"></div><div id="panelButtons"></div></div></div></div><small>Research prototype — replace sample interview text with actual participant quotations.</small><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),title=document.getElementById('panelTitle'),body=document.getElementById('panelBody'),buttons=document.getElementById('panelButtons'),mission=document.getElementById('mission'),sceneLabel=document.getElementById('sceneLabel');let scene='stop',player={x:90,y:385},done=new Set(),travel=0,dialogueIndex=0,locked=false;const interviews={a:[['Student 1','How do you usually travel to campus?'],['Student 1','[...]'],['Researcher','Thank you for sharing your experience.']],b:[['Student 2','What makes evening campus events difficult to attend?'],['Student 2','[...]'],['Researcher','Thank you. This helps our research.']],friend:[['Friend','It is getting late. You can stay here tonight.'],['Researcher','Thank you! We will travel to campus tomorrow.']]};const actors={stop:[{id:'a',x:335,y:280,label:'Student 1',color:'#bc666e'},{id:'b',x:570,y:350,label:'Student 2',color:'#8764bb'},{id:'bus',x:785,y:280,label:'Bus',color:'#e6ac41'}],housing:[{id:'video1',x:330,y:285,label:'Interview 3',color:'#bc666e'},{id:'video2',x:600,y:330,label:'Interview 4',color:'#8764bb'},{id:'friend',x:775,y:250,label:'Friend',color:'#5b89bd'}],auditorium:[{id:'present',x:480,y:180,label:'Presentation',color:'#d9ae5b'}]};function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function text(t,x,y,size=17,color='#1e293b'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,y)}function drawPerson(x,y,color){rect(x-11,y-27,22,18,'#e6b995');rect(x-13,y-31,26,8,'#3b342f');rect(x-14,y-9,28,24,color);rect(x-12,y+15,10,13,'#27384a');rect(x+2,y+15,10,13,'#27384a')}function draw(){rect(0,0,960,520,scene==='auditorium'?'#b9a77c':'#80bc70');if(scene==='stop'){for(let x=0;x<960;x+=85){for(let y=0;y<520;y+=90){rect(x+12,y+14,15,8,'#70a85d')}}rect(0,360,960,105,'#dfca9d');rect(0,350,960,12,'#c3b088');rect(0,465,960,10,'#c3b088');rect(680,165,230,135,'#dfae49');rect(690,182,100,44,'#9ed2df');rect(800,182,96,44,'#9ed2df');rect(680,291,230,12,'#4c4c4c');rect(708,299,35,25,'#31383b');rect(845,299,35,25,'#31383b');rect(45,70,140,85,'#6e9bba');rect(55,82,120,50,'#dce9e8');text('BUS STOP',115,112,17);text('START',90,340,16)}if(scene==='housing'){rect(0,370,960,95,'#dfca9d');rect(160,85,650,250,'#c8b0a1');rect(180,105,610,45,'#9e6b62');for(let x=220;x<780;x+=115){rect(x,185,58,70,'#a9d6e0')}rect(455,260,70,75,'#6a544a');text('HOUSING COMPLEX',480,67,24)}if(scene==='auditorium'){rect(160,55,640,205,'#51443f');rect(200,85,560,120,'#d9e6e6');text('RESEARCH PRESENTATION',480,155,27);for(let y=315;y<500;y+=55)for(let x=130;x<850;x+=80)rect(x,y,50,32,'#775f62')}if(scene==='travel'){rect(0,350,960,170,'#59606a');let offset=travel%150;for(let i=-1;i<9;i++){let x=i*150-offset;rect(x+35,190,15,165,'#67513c');rect(x,125,85,95,'#3d8d54');rect(x+20,100,55,70,'#4e9e60')}rect(310,275,340,125,'#e2a83b');rect(325,285,210,55,'#9bcdd7');rect(548,285,85,55,'#9bcdd7');rect(330,389,55,55,'#30343c');rect(570,389,55,55,'#30343c');text('ON THE BUS',480,250,25,'#fff');return}for(const a of actors[scene]||[]){if(a.id==='bus')continue;drawPerson(a.x,a.y,a.color);text(done.has(a.id)?'✓ '+a.label:a.label,a.x,a.y-44,15)}drawPerson(player.x,player.y,'#4666bb');text('YOU',player.x,player.y-45,14)}function updateHUD(){sceneLabel.textContent={stop:'Scene 1: Bus Stop',housing:'Scene 2: Housing Complex',travel:'Bus Journey',auditorium:'Scene 3: Auditorium'}[scene];mission.textContent=scene==='stop'?`Mission: Interview 2 students (${['a','b'].filter(x=>done.has(x)).length}/2)`:scene==='housing'?`Mission: View 2 interviews (${['video1','video2'].filter(x=>done.has(x)).length}/2) and meet your friend`:scene==='auditorium'?'Mission: Present your research':'Travelling...'}function show(t,content,opts=[['Continue',close]]){locked=true;overlay.style.display='flex';title.textContent=t;body.replaceChildren();if(typeof content==='string'){const p=document.createElement('p');p.textContent=content;body.append(p)}else body.append(content);buttons.replaceChildren();opts.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;buttons.append(b)})}function close(){overlay.style.display='none';locked=false}function dialogue(id){let lines=interviews[id];if(!lines)return;let index=0;function next(){if(index>=lines.length){done.add(id);close();updateHUD();return}let [speaker,line]=lines[index++];show(speaker,line,[[index===lines.length?'Finish':'Next',next]])}next()}function video(id){let box=document.createElement('div'),p=document.createElement('p');p.textContent='Interview video.';box.append(p);let v=document.createElement('video');v.controls=true;v.src=id==='video1'?'assets/interview1.mp4':'assets/interview2.mp4';box.append(v);show(id==='video1'?'Video Interview 1':'Video Interview 2',box,[['Mark interview complete',()=>{v.pause();done.add(id);close();updateHUD()}]])}function board(){if(scene==='stop'&&(!done.has('a')||!done.has('b'))){show('Bus driver','Please complete both interviews before boarding.');return}show('Board the bus?','Travel to the next destination?',[['Yes',()=>{close();startTravel()}],['No',close]])}function startTravel(){scene='travel';travel=0;updateHUD();let start=performance.now();function tick(now){if(scene!=='travel')return;travel+=(now-start)/16;start=now;draw();if(travel<340)requestAnimationFrame(tick);else{scene=done.has('night')?'auditorium':'housing';player={x:100,y:395};updateHUD();draw();if(scene==='auditorium')show('Welcome to the Auditorium','Your research presentation is ready.',[['Open presentation',presentation],['Explore',close]])}}requestAnimationFrame(tick)}function night(){done.add('night');show('The next morning','After staying with your friend, you return to the bus stop. The next destination is the auditorium.',[['Board the bus',()=>{close();startTravel()}]])}function presentation(){let pages=[['Research Question','How does transportation availability affect off-campus students’ participation in campus life?'],['Interview Findings','[secondary research.]'],['Analysis','[analysis.]'],['Recommendations','[proposed transportation improvements.]'],['Conclusion','Thank you for exploring our research!']];let i=0;function page(){show(pages[i][0],pages[i][1],[...(i?[['Previous',()=>{i--;page()}]]:[]),[i===pages.length-1?'Finish':'Next',()=>{if(++i>=pages.length)close();else page()}]])}page()}function interact(id){if(locked||scene==='travel')return;if(!id){let candidates=actors[scene]||[];let nearby=candidates.map(a=>({...a,d:Math.hypot(a.x-player.x,a.y-player.y)})).sort((a,b)=>a.d-b.d)[0];if(!nearby||nearby.d>105){show('Explore','Walk closer to a person or the bus and press E.');return}id=nearby.id}if(id==='bus')board();else if(id==='video1'||id==='video2')video(id);else if(id==='friend'){if(!done.has('video1')||!done.has('video2'))show('Friend','Watch both interviews first, then we can call it a night.');else dialogue('friend')}else if(id==='present')presentation();else dialogue(id)}function move(dx,dy){if(locked||scene==='travel')return;player.x=Math.max(22,Math.min(938,player.x+dx));player.y=Math.max(55,Math.min(485,player.y+dy));draw()}document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e'){interact();return}let d={arrowup:[0,-22],w:[0,-22],arrowdown:[0,22],s:[0,22],arrowleft:[-22,0],a:[-22,0],arrowright:[22,0],d:[22,0]}[e.key.toLowerCase()];if(d)move(...d)});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let d={up:[0,-25],down:[0,25],left:[-25,0],right:[25,0]};move(...d[b.dataset.move])});document.getElementById('interact').onclick=()=>interact();canvas.addEventListener('click',e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width,y=(e.clientY-r.top)*520/r.height;let a=(actors[scene]||[]).find(a=>Math.hypot(x-a.x,y-a.y)<55);if(a)interact(a.id)});const oldDialogue=dialogue;dialogue=function(id){if(id==='friend'){let lines=interviews.friend,index=0;function next(){if(index>=lines.length){close();night();return}let [speaker,line]=lines[index++];show(speaker,line,[[index===lines.length?'Continue':'Next',next]])}next()}else oldDialogue(id)};updateHUD();draw();
</script></body></html>
